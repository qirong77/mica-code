<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Mica Code</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:"
    />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="titlebar-drag drag-region" aria-hidden="true"></div>
        <div class="sidebar-header no-drag">
          <div class="brand">
            <span class="brand-mark">M</span>
            <div>
              <div class="brand-title">Mica Code</div>
            </div>
          </div>
          <div class="sidebar-actions">
            <button
              id="btn-new-folder"
              class="icon-btn"
              title="新建文件夹"
              aria-label="新建文件夹"
            ></button>
            <button
              id="btn-new-terminal"
              class="icon-btn"
              title="新建终端"
              aria-label="新建终端"
            ></button>
          </div>
        </div>
        <!-- <div class="sidebar-search no-drag">
          <div class="search-field">
            <span class="search-icon" id="search-icon" aria-hidden="true"></span>
            <input
              id="session-search"
              class="search-input"
              type="search"
              placeholder="搜索会话"
              aria-label="搜索会话"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              type="button"
              id="session-search-clear"
              class="search-clear hidden"
              title="清除"
              aria-label="清除搜索"
            ></button>
          </div>
        </div> -->
        <div id="session-tree" class="session-tree no-drag"></div>
      </aside>

      <main class="workspace">
        <nav
          id="workspace-tabs"
          class="workspace-tabs drag-region"
          role="tablist"
          aria-label="工作区视图"
        >
          <button
            class="workspace-tab is-active no-drag"
            type="button"
            role="tab"
            aria-selected="true"
            data-view="terminal"
          >
            <span class="workspace-tab-icon" data-icon="terminal" aria-hidden="true"></span>
            <span>终端</span>
          </button>
          <button
            class="workspace-tab no-drag"
            type="button"
            role="tab"
            aria-selected="false"
            data-view="files"
          >
            <span class="workspace-tab-icon" data-icon="folder" aria-hidden="true"></span>
            <span>文件夹</span>
          </button>
          <button
            class="workspace-tab no-drag"
            type="button"
            role="tab"
            aria-selected="false"
            data-view="git-compare"
          >
            <span class="workspace-tab-icon" data-icon="git-compare" aria-hidden="true"></span>
            <span>Git</span>
            <span id="git-change-count" class="git-change-count" hidden></span>
          </button>
        </nav>
        <section id="terminal-host" class="terminal-host no-drag"></section>
        <section id="files-view" class="files-view no-drag" hidden>
          <header class="files-toolbar">
            <button
              id="files-up"
              class="files-tool-btn"
              type="button"
              title="返回上级目录"
              aria-label="返回上级目录"
            ></button>
            <div id="files-path" class="files-path" title=""></div>
            <button
              id="files-refresh"
              class="files-tool-btn"
              type="button"
              title="刷新"
              aria-label="刷新"
            ></button>
          </header>
          <div id="files-list" class="files-list"></div>
          <div id="files-status" class="files-status"></div>
        </section>
        <section id="git-compare-view" class="git-compare-view no-drag" hidden>
          <aside class="git-tree-pane">
            <header class="git-tree-header">
              <div class="git-tree-heading">CHANGES</div>
              <button
                id="git-refresh"
                class="files-tool-btn"
                type="button"
                title="刷新 Git 变化"
                aria-label="刷新 Git 变化"
              ></button>
            </header>
            <div id="git-repository-path" class="git-repository-path"></div>
            <div id="git-change-tree" class="git-change-tree"></div>
          </aside>
          <div
            id="git-pane-resizer"
            class="git-pane-resizer"
            role="separator"
            aria-label="调整 Git 变化列表宽度"
            aria-orientation="vertical"
            aria-valuemin="160"
            tabindex="0"
          ></div>
          <section class="git-diff-pane">
            <header id="git-diff-header" class="git-diff-header" hidden>
              <span id="git-diff-file" class="git-diff-file"></span>
              <span id="git-diff-stat" class="git-diff-stat"></span>
            </header>
            <div id="git-diff-editor" class="git-diff-editor"></div>
            <div id="git-compare-status" class="git-compare-status">选择变化的文件以查看对比</div>
          </section>
        </section>
        <div id="empty-state" class="empty-state">选择或新建一个终端会话</div>
      </main>
    </div>

    <button
      id="sidebar-toggle"
      class="titlebar-sidebar-toggle no-drag"
      type="button"
      title="收起侧栏"
      aria-label="收起侧栏"
      aria-expanded="true"
    ></button>

    <script type="module" src="./src/renderer.js"></script>
  </body>
</html>
