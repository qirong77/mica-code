name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build install.sh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build binaries
        run: |
          mkdir -p dist/release

          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-linux-x64 MICA_BUILD_OUTFILE=dist/release/mica-code-linux-x64 bun scripts/build.mjs
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-linux-arm64 MICA_BUILD_OUTFILE=dist/release/mica-code-linux-arm64 bun scripts/build.mjs
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-darwin-x64 MICA_BUILD_OUTFILE=dist/release/mica-code-darwin-x64 bun scripts/build.mjs
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-darwin-arm64 MICA_BUILD_OUTFILE=dist/release/mica-code-darwin-arm64 bun scripts/build.mjs

          chmod 755 dist/release/mica-code-*

      - name: Build installer
        run: |
          tar -czf dist/mica-code-payload.tar.gz -C dist/release .
          base64 < dist/mica-code-payload.tar.gz > dist/mica-code-payload.tar.gz.b64

          awk '
            /^__MICA_CODE_PAYLOAD__$/ {
              while ((getline line < "dist/mica-code-payload.tar.gz.b64") > 0) print line
              next
            }
            { print }
          ' scripts/install.sh > install.sh

          chmod 755 install.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: install.sh

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
