name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-checks:
    name: Desktop checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint

  build:
    name: Build release assets
    needs: desktop-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build binaries
        run: |
          mkdir -p dist/release

          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-linux-x64 MICA_BUILD_OUTFILE=dist/release/mica-code-linux-x64 bun scripts/build.mjs
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-linux-arm64 MICA_BUILD_OUTFILE=dist/release/mica-code-linux-arm64 bun scripts/build.mjs
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-darwin-x64 MICA_BUILD_OUTFILE=dist/release/mica-code-darwin-x64 bun scripts/build.mjs
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=bun-darwin-arm64 MICA_BUILD_OUTFILE=dist/release/mica-code-darwin-arm64 bun scripts/build.mjs

          chmod 755 dist/release/mica-code-*

      - name: Package release archives
        run: |
          mkdir -p dist/packages

          for binary in dist/release/mica-code-*; do
            name="$(basename "$binary")"
            # Maximum portable gzip compression for release downloads.
            GZIP=-9 tar -czf "dist/packages/${name}.tar.gz" -C dist/release "$name"
          done

          # Ship the thin installer as-is. It downloads only the current platform archive.
          cp scripts/install.sh install.sh
          chmod 755 install.sh

          (
            cd dist/packages
            sha256sum *.tar.gz
          ) > dist/packages/sha256sums.txt
          sha256sum install.sh >> dist/packages/sha256sums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mica-code-release
          path: |
            install.sh
            dist/packages/*.tar.gz
            dist/packages/sha256sums.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest' }}
        run: |
          # Recreate the mutable release so old bare binaries / payload assets do not linger.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes --cleanup-tag
          fi
          gh release create "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Release $RELEASE_TITLE" \
            install.sh \
            dist/packages/*.tar.gz \
            dist/packages/sha256sums.txt
