name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-checks:
    name: Desktop checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint

  checks:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # 每个目标平台一个独立 job：在对应架构 runner 上 bun install，
  # 保证 node-pty 的原生产物（linux 编译 / darwin prebuilds）与目标平台一致。
  build:
    name: Build ${{ matrix.asset }}
    needs: [desktop-checks, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: mica-code-linux-x64
            runner: ubuntu-latest
            pty-os: linux
            pty-arch: x64
          - target: bun-linux-arm64
            asset: mica-code-linux-arm64
            runner: ubuntu-24.04-arm
            pty-os: linux
            pty-arch: arm64
          - target: bun-darwin-x64
            asset: mica-code-darwin-x64
            runner: ubuntu-latest
            pty-os: darwin
            pty-arch: x64
          - target: bun-darwin-arm64
            asset: mica-code-darwin-arm64
            runner: ubuntu-latest
            pty-os: darwin
            pty-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (compiles node-pty native binding)
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=${{ matrix.target }} \
          MICA_BUILD_ALIASES= \
          MICA_BUILD_OUTFILE=dist/release/${{ matrix.asset }} bun scripts/build.mjs
          chmod 755 dist/release/${{ matrix.asset }}

      - name: Package release archive (binary + node-pty runtime)
        run: |
          MICA_ASSET_NAME=${{ matrix.asset }} \
          MICA_PTY_TARGET_OS=${{ matrix.pty-os }} \
          MICA_PTY_TARGET_ARCH=${{ matrix.pty-arch }} \
          bun scripts/package-release.mjs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/packages/${{ matrix.asset }}.tar.gz

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true

      - name: Prepare release assets
        run: |
          # Ship the thin installer as-is. It downloads only the current platform archive.
          cp scripts/install.sh install.sh
          chmod 755 install.sh

          (
            cd dist/packages
            sha256sum *.tar.gz
          ) > dist/packages/sha256sums.txt
          sha256sum install.sh >> dist/packages/sha256sums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mica-code-release
          path: |
            install.sh
            dist/packages/*.tar.gz
            dist/packages/sha256sums.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest' }}
        run: |
          # Recreate the mutable release so old bare binaries / payload assets do not linger.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes --cleanup-tag
          fi
          gh release create "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Release $RELEASE_TITLE" \
            install.sh \
            dist/packages/*.tar.gz \
            dist/packages/sha256sums.txt
