name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: mica-linux-x64
            target: bun-linux-x64
          - asset: mica-linux-arm64
            target: bun-linux-arm64
          - asset: mica-darwin-x64
            target: bun-darwin-x64
          - asset: mica-darwin-arm64
            target: bun-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build binary
        env:
          MICA_PREBUILD_DONE: '1'
          MICA_BUILD_TARGET: ${{ matrix.target }}
          MICA_BUILD_OUTFILE: dist/mica
        run: bun scripts/build.mjs

      - name: Package artifact
        run: |
          tar -czf ${{ matrix.asset }}.tar.gz -C dist mica
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
