name: Build installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-checks:
    name: Desktop checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # 桌面测试会 import 仓库内的 packages/*，它们各自的依赖（nanostores 之类）
      # 来自仓库根，只跑 apps/desktop 的 npm ci 解析不到。
      - name: Install repo dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          npm test
          npm test -- scripts/verify-update-assets.test.js
      - name: Lint
        run: npm run lint

  checks:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # 每个目标平台一个独立 job：在对应架构 runner 上 bun install，
  # 保证 node-pty 的原生产物（linux 编译 / darwin prebuilds）与目标平台一致。
  build:
    name: Build ${{ matrix.asset }}
    needs: [desktop-checks, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: mica-code-linux-x64
            runner: ubuntu-latest
            pty-os: linux
            pty-arch: x64
          - target: bun-linux-arm64
            asset: mica-code-linux-arm64
            runner: ubuntu-24.04-arm
            pty-os: linux
            pty-arch: arm64
          - target: bun-darwin-x64
            asset: mica-code-darwin-x64
            runner: ubuntu-latest
            pty-os: darwin
            pty-arch: x64
          - target: bun-darwin-arm64
            asset: mica-code-darwin-arm64
            runner: ubuntu-latest
            pty-os: darwin
            pty-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (compiles node-pty native binding)
        run: bun install --frozen-lockfile

      # Refresh the bundled models.dev seed so release binaries ship recent model
      # metadata. Never blocks the build: the committed seed stays as a fallback.
      - name: Refresh bundled models.dev seed
        run: |
          bun scripts/update-models-dev-seed.mjs || \
            echo "::warning::models.dev seed refresh failed; shipping the committed seed"

      - name: Build binary
        run: |
          MICA_PREBUILD_DONE=1 MICA_BUILD_TARGET=${{ matrix.target }} \
          MICA_BUILD_OUTFILE=dist/release/${{ matrix.asset }} bun scripts/build.mjs
          chmod 755 dist/release/${{ matrix.asset }}

      - name: Package release archive (binary + node-pty runtime)
        run: |
          MICA_ASSET_NAME=${{ matrix.asset }} \
          MICA_PTY_TARGET_OS=${{ matrix.pty-os }} \
          MICA_PTY_TARGET_ARCH=${{ matrix.pty-arch }} \
          bun scripts/package-release.mjs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/packages/${{ matrix.asset }}.tar.gz

  # Electron 的桌面更新包与 CLI 是两条发布链路。桌面端用 electron-builder
  # 生成 latest-*.yml 和平台安装包，electron-updater 只消费这组文件；不要把
  # CLI tar.gz 当成桌面更新包。桌面 job 不依赖 CLI 全量测试，避免一个与
  # Electron 更新无关的 CLI 测试失败时把已经验证过的桌面更新包一起挡掉。
  desktop-linux:
    name: Build desktop mica-code-linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install repo dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test desktop updater
        working-directory: apps/desktop
        run: npm test -- src/main/app-update.test.js src/server/update-check.test.js src/renderer/src/app-update.test.js

      - name: Build Linux desktop updater package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -rf dist
          npm run build:linux -- --publish never -c.extraMetadata.version=1.0.${GITHUB_RUN_NUMBER}

      - name: Verify desktop updater assets
        run: bun apps/desktop/scripts/verify-update-assets.mjs apps/desktop/dist linux 1.0.${GITHUB_RUN_NUMBER}

      - name: Upload desktop updater package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mica-code-linux-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.snap
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml

  # macOS is published only when the runner and a stable Developer ID
  # certificate are available. A missing macOS secret skips only the macOS
  # artifact with a visible warning; it must never publish an unsigned package
  # that Squirrel.Mac cannot install or block a valid Linux update.
  desktop-mac:
    name: Build desktop mica-code-mac-arm64
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    outputs:
      available: ${{ steps.signing.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Check macOS signing configuration
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "::warning::macOS updater package skipped: configure CSC_LINK and CSC_KEY_PASSWORD with a Developer ID Application certificate."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install repo dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test desktop updater
        working-directory: apps/desktop
        run: npm test -- src/main/app-update.test.js src/server/update-check.test.js src/renderer/src/app-update.test.js

      - name: Run real MacUpdater download smoke
        working-directory: apps/desktop
        run: node scripts/test-app-update-e2e.mjs

      - name: Build macOS desktop updater package
        if: steps.signing.outputs.available == 'true'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          rm -rf dist
          # Clear the local self-signed identity; electron-builder discovers the
          # imported Developer ID certificate from CSC_LINK.
          npm run build:mac -- --arm64 --publish never -c.mac.identity= -c.forceCodeSigning=true -c.extraMetadata.version=1.0.${GITHUB_RUN_NUMBER}

      - name: Verify desktop updater assets
        if: steps.signing.outputs.available == 'true'
        run: bun apps/desktop/scripts/verify-update-assets.mjs apps/desktop/dist mac 1.0.${GITHUB_RUN_NUMBER}

      - name: Verify signed macOS updater bundle
        if: steps.signing.outputs.available == 'true'
        working-directory: apps/desktop
        run: |
          bundles=(dist/mac-arm64/*.app)
          [[ ${#bundles[@]} -eq 1 && -d "${bundles[0]}" ]]
          test -s "${bundles[0]}/Contents/Resources/app-update.yml"
          codesign --verify --deep --strict "${bundles[0]}"
          signature=$(codesign --display --verbose=2 "${bundles[0]}" 2>&1)
          grep -q '^Authority=Developer ID Application:' <<< "$signature"

      - name: Upload desktop updater package
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mica-code-mac-arm64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.snap
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml

  publish:
    name: Publish CLI release assets
    needs: [build]
    if: ${{ needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    concurrency:
      group: release-assets-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: mica-code-*
          path: dist/packages
          merge-multiple: true

      - name: Prepare release assets
        run: |
          # Ship the thin installer as-is. It downloads only the current platform archive.
          cp scripts/install.sh install.sh
          chmod 755 install.sh

          (
            cd dist/packages
            sha256sum *.tar.gz
          ) > dist/packages/sha256sums.txt
          sha256sum install.sh >> dist/packages/sha256sums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mica-code-release
          path: |
            install.sh
            dist/packages/*.tar.gz
            dist/packages/sha256sums.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest' }}
        run: |
          # Keep older payloads: clients may still be downloading an older manifest.
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG_NAME" install.sh dist/packages/*.tar.gz dist/packages/sha256sums.txt --clobber

  # Desktop updater assets are published independently from the CLI archives.
  # The feed in electron-builder.yml intentionally points at the rolling
  # `latest` Release, so tagged builds also update that same feed.
  desktop-publish:
    name: Publish desktop updater assets
    needs: [desktop-linux, desktop-mac]
    if: ${{ always() && needs.desktop-linux.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    concurrency:
      group: release-assets-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux desktop updater package
        uses: actions/download-artifact@v4
        with:
          name: desktop-mica-code-linux-x64
          path: dist/desktop/linux

      - name: Download macOS desktop updater package
        if: needs.desktop-mac.result == 'success' && needs.desktop-mac.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-mica-code-mac-arm64
          path: dist/desktop/mac

      - name: Re-verify downloaded Linux updater assets
        run: bun apps/desktop/scripts/verify-update-assets.mjs dist/desktop/linux linux 1.0.${GITHUB_RUN_NUMBER}

      - name: Re-verify downloaded macOS updater assets
        if: needs.desktop-mac.result == 'success' && needs.desktop-mac.outputs.available == 'true'
        run: bun apps/desktop/scripts/verify-update-assets.mjs dist/desktop/mac mac 1.0.${GITHUB_RUN_NUMBER}

      - name: Upload desktop updater workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-updater-release
          if-no-files-found: error
          path: dist/desktop

      - name: Publish desktop updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: latest
          RELEASE_TITLE: Latest
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file .github/release-notes.md
          fi
          # Publish payloads first; never expose a manifest whose payload is not uploaded.
          shopt -s nullglob
          mapfile -t payloads < <(find dist/desktop -type f ! -name 'latest*.yml' -print | sort)
          mapfile -t manifests < <(find dist/desktop -type f -name 'latest*.yml' -print | sort)
          (( ${#payloads[@]} > 0 && ${#manifests[@]} > 0 ))
          gh release upload "$TAG_NAME" "${payloads[@]}" --clobber
          gh release upload "$TAG_NAME" "${manifests[@]}" --clobber
