<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Mica</title>
  <defs>
    <linearGradient id="mica-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- 全仓库唯一的品牌标志：桌面 App、官网、config-web、README 都引用这一份，不要再复制副本。
       这里画的是「满幅」形态（瓦片铺满 viewBox）——网页图标必须满幅，否则浏览器标签、
       iOS「添加到主屏幕」（自己会套 22.375% 圆角遮罩）里的图标会缩一圈。
       macOS 原生图标要的 824/1024 经典网格外边距不在这里，由
       apps/desktop/scripts/generate-icons.py 渲染时外扩 viewBox 补上。
       圆角用 Apple 规范的 22.375%（14.32/64）：macOS 26 Tahoe 会把 rx >= 20/64 的
       legacy 图标套上灰色 "icon jail" 底板，22.375% 仍在安全范围内。 -->
  <rect width="64" height="64" rx="14.32" fill="url(#mica-bg)"/>
  <!-- handwritten M: four uneven strokes, slightly curved and tilted -->
  <g transform="rotate(-2 32 32)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.4 43.2 Q19.4 32.6 20.6 22.6" stroke-width="6.9"/>
    <path d="M22 21.4 L32.4 34.2" stroke-width="6.5"/>
    <path d="M32.4 34.2 L41.4 21.8" stroke-width="6.6"/>
    <path d="M42.8 22.6 Q45.4 32.6 44.2 43" stroke-width="6.3"/>
  </g>
</svg>
