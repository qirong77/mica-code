<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Mica</title>
  <defs>
    <linearGradient id="mica-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- macOS 26 Tahoe renders any legacy icon whose shape it does not read as
       a rounded rectangle on a gray "icon jail" plate. The trigger is the
       corner radius, not the transparent margin: verified on macOS 26.0 via
       IconServices that rx <= 19/64 renders normally and rx >= 20/64 gets
       jailed. Keep rx at Apple's 22.375% (14.32/64) with headroom.
       The 6.25/64 margin keeps the classic 824/1024 grid on macOS <= 15;
       Tahoe scales the artwork up to fill the tile either way. -->
  <g transform="translate(6.25 6.25) scale(0.8046875)">
    <rect width="64" height="64" rx="14.32" fill="url(#mica-bg)"/>
    <!-- handwritten M: four uneven strokes, slightly curved and tilted -->
    <g transform="rotate(-2 32 32)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.4 43.2 Q19.4 32.6 20.6 22.6" stroke-width="6.9"/>
      <path d="M22 21.4 L32.4 34.2" stroke-width="6.5"/>
      <path d="M32.4 34.2 L41.4 21.8" stroke-width="6.6"/>
      <path d="M42.8 22.6 Q45.4 32.6 44.2 43" stroke-width="6.3"/>
    </g>
  </g>
</svg>
