<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 和终端窗口同一个口径：只跑自己的脚本与样式。没有 preload，页面靠日志桥与主进程通信。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <meta name="theme-color" content="#2b2b2b" />
    <!-- 首帧主题（与主窗口同一份脚本）：顶栏跟应用主题一起变，别先闪一帧深色。 -->
    <script src="./theme-boot.js"></script>
    <title>受控浏览器</title>
  </head>
  <body class="mica-arco-theme">
    <div id="root"></div>
    <script type="module" src="./src/browser-chrome/index.jsx"></script>
  </body>
</html>
