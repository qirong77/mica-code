appId: com.mica.code
productName: mica-code-app
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
# 注意：app.asar 里只会出现 package.json 的 dependencies。renderer 的依赖全部归在
# devDependencies（已由 Vite 打进 out/renderer），谁把前端包挪回 dependencies，asar 就会
# 从 15MB 涨到 200MB 以上，并连带拖慢 asar 写入与 zip/dmg 压缩。
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
  # 手机端页面靠它对中转机做增量发布；asar 里的副本外部进程读不到。
  - out/renderer/**
win:
  executableName: mica-code-app
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Mica Code needs Documents access only if you open project folders there.
    NSDownloadsFolderUsageDescription: Mica Code needs Downloads access only if you open project folders there.
    NSDesktopFolderUsageDescription: Mica Code needs Desktop access to open terminal sessions in your Desktop project folders.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
