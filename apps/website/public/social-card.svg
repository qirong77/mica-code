<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mica Code — 从一个想法，到可运行的代码。</title>
  <desc id="desc">开源 AI 编程工作区，连接自己的模型，在终端、桌面和浏览器中理解项目、修改代码、运行验证。</desc>
  <rect width="1200" height="630" fill="#0b1017"/>
  <path d="M0 567H1200M734 0V567" stroke="#24303e"/>
  <image x="64" y="54" width="42" height="42" href="data:image/svg+xml;base64,"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="122" y="85" font-size="29" fill="#edf2f8" font-weight="650">Mica<tspan fill="#a1afc0" font-weight="400"> Code</tspan></text>
    <rect x="64" y="141" width="183" height="31" rx="15.5" fill="#111822" stroke="#354456"/>
    <circle cx="81" cy="157" r="3" fill="#74d9e9"/>
    <text x="94" y="162" font-size="13" fill="#a1afc0">开源 AI 编程工作区</text>
    <text x="64" y="257" font-size="58" font-weight="650" fill="#edf2f8">从一个想法，</text>
    <text x="64" y="337" font-size="58" font-weight="650" fill="#a5eaf3">到可运行的代码。</text>
    <text x="67" y="400" font-size="20" fill="#a1afc0">连接你的模型，走进真实的项目。</text>
    <text x="67" y="434" font-size="20" fill="#a1afc0">从理解、修改到验证，把工作接着做完。</text>
    <text x="67" y="514" font-size="14" fill="#7d8ea3">终端 TUI<tspan dx="20">/</tspan><tspan dx="20">桌面与 Web</tspan><tspan dx="20">/</tspan><tspan dx="20">Headless API</tspan></text>
    <g transform="translate(782 165)">
      <rect width="353" height="301" rx="12" fill="#111822" stroke="#354456"/>
      <path d="M0 41H353" stroke="#24303e"/>
      <circle cx="18" cy="21" r="3" fill="#a68b84"/><circle cx="30" cy="21" r="3" fill="#a99f7d"/><circle cx="42" cy="21" r="3" fill="#779a8b"/>
      <text x="79" y="25" font-family="monospace" font-size="11" fill="#7d8ea3">mica / your-project</text>
      <text x="24" y="82" font-size="14" fill="#edf2f8">从项目上下文开始</text>
      <path d="M25 103H324" stroke="#24303e"/>
      <g font-size="13" fill="#a1afc0">
        <text x="24" y="138" fill="#74d9e9">01</text><text x="61" y="138">阅读代码与项目约定</text>
        <text x="24" y="178" fill="#74d9e9">02</text><text x="61" y="178">修改文件，运行验证</text>
        <text x="24" y="218" fill="#74d9e9">03</text><text x="61" y="218">审阅结果，继续推进</text>
      </g>
      <rect x="19" y="247" width="314" height="34" rx="5" fill="#0b1017" stroke="#24303e"/>
      <text x="31" y="269" font-size="11" fill="#7d8ea3">下一项任务，从这里开始。</text>
    </g>
    <text x="66" y="605" font-size="14" font-family="monospace" fill="#7d8ea3">github.com/qirong77/mica-code</text>
    <text x="1134" y="605" text-anchor="end" font-size="11" font-family="monospace" fill="#7d8ea3">MINIMAL. INTELLIGENT. CACHE-FIRST.</text>
  </g>
</svg>
