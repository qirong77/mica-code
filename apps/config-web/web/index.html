<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b2b2b" />
    <title>Mica Config</title>
    <!-- 首帧主题：在页面组件加载前同步执行，否则浅色用户会先看到一帧深色。
         这是 classic script（不能 import），只读 main.tsx 写入的 localStorage 缓存，
         按 prefers-color-scheme 解析 auto，把 data-theme / data-appearance / color-scheme /
         根底色 / theme-color 定下来。下面这张主题表是
         packages/mica-web-shared/theme.ts 里 THEMES 的副本——classic script 引不进模块，
         只能重复一份常量，加主题时两处一起改。 -->
    <script>
      (function bootTheme() {
        var key = 'mica.theme.preference';
        var THEMES = {
          dark: { appearance: 'dark', canvas: '#2b2b2b' },
          light: { appearance: 'light', canvas: '#ffffff' },
          mocha: { appearance: 'dark', canvas: '#1e1e2e' },
          latte: { appearance: 'light', canvas: '#eff1f5' },
          'tokyo-night': { appearance: 'dark', canvas: '#1a1b26' },
          'tokyo-night-light': { appearance: 'light', canvas: '#e6e7ed' },
        };
        var preference = 'auto';
        try {
          var cached = window.localStorage.getItem(key);
          if (cached === 'auto' || Object.prototype.hasOwnProperty.call(THEMES, cached)) preference = cached;
        } catch (error) {
          // 存储在隐私模式下不可用：退化为跟随系统。
          preference = 'auto';
        }
        var prefersLight =
          typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = preference === 'auto' ? (prefersLight ? 'light' : 'dark') : preference;
        var definition = THEMES[theme] || THEMES.dark;
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-appearance', definition.appearance);
        root.style.colorScheme = definition.appearance;
        root.style.background = definition.canvas;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', definition.canvas);
      })();
    </script>
    <!-- 品牌标志全仓库只有一份，直接引用 apps/desktop/resources/icon.svg。
         Vite 会把它作为资源产出并改写这里的 href。 -->
    <link rel="icon" type="image/svg+xml" href="../../desktop/resources/icon.svg" />
    <script type="importmap">
      {
        "imports": {
          "@monaco-editor/react": "https://esm.sh/@monaco-editor/react@4.7.0?bundle&external=react,react-dom",
          "react": "https://esm.sh/react@19.0.0?bundle",
          "react-dom": "https://esm.sh/react-dom@19.0.0?bundle&external=react",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client?bundle&external=react",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime?bundle"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
