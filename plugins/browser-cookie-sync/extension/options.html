<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mica Cookie Sync</title>
    <style>
      body { max-width: 520px; margin: 32px auto; padding: 0 20px; font: 15px system-ui, sans-serif; line-height: 1.5; }
      label { display: block; margin-bottom: 8px; }
      input { box-sizing: border-box; width: 100%; padding: 8px; }
      button { margin-top: 12px; padding: 8px 16px; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>Mica Cookie Sync</h1>
    <p>Paste the token from Mica's Browser Cookie Sync settings. It stays in this extension's local storage and is sent only to the service on 127.0.0.1.</p>
    <form id="settings">
      <label for="token">Local service token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">Save token</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="options.js"></script>
  </body>
</html>
